<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davi Melo | Flyers & Design Promocional</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #1a2126;
            --accent-blue: #00e5ff;
            --text-primary: #ffffff;
            --text-secondary: #8b949e;
            --border-color: #2d3842;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-family);
            color: var(--text-primary);
            padding: 30px 4%;
        }

        .btn-voltar {
            display: inline-block;
            color: var(--text-secondary);
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 25px;
            transition: color 0.3s;
            font-size: 11pt;
            cursor: pointer;
        }

        .btn-voltar:hover {
            color: var(--accent-blue);
        }

        /* Estrutura de Tabela para os Quadrados de Temas / Clientes */
        .grid-menu {
            display: table;
            width: 100%;
            border-collapse: separate;
            border-spacing: 20px;
        }

        .menu-linha {
            display: table-row;
        }

        .quadrado-tema {
            display: table-cell;
            width: 33.33%;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            vertical-align: top;
            text-align: center;
            padding-bottom: 25px;
            transition: transform 0.3s, border-color 0.3s;
        }

        .quadrado-tema:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
        }

        .quadrado-tema img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .quadrado-tema h3 {
            font-size: 14pt;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .btn-abrir {
            display: inline-block;
            background-color: var(--accent-blue);
            color: #000;
            padding: 9px 22px;
            font-size: 10pt;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-abrir:hover {
            background-color: #00b8d4;
        }

        /* Estrutura Oculta Inicial para Galerias e Sub-menus */
        .galeria-fotos, .sub-menu {
            display: none;
        }

        /* Mural de Fotos */
        .mural-fotos {
            display: table;
            width: 100%;
            border-collapse: separate;
            border-spacing: 15px;
            margin-top: 20px;
        }

        .mural-linha {
            display: table-row;
        }

        .mural-coluna {
            display: table-cell;
            width: 33.33%;
            vertical-align: top;
        }

        .mural-coluna img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
            transition: transform 0.3s ease, filter 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .mural-coluna img:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
            cursor: pointer;
        }

        /* Estilo do Lightbox */
        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            text-align: center;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 80vh;
            margin: 5vh auto;
            display: inline-block;
            vertical-align: middle;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            animation: zoomIn 0.3s ease;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
        }

        .lightbox-close:hover {
            color: var(--accent-blue);
        }

        .lightbox-helper {
            display: inline-block;
            height: 100%;
            vertical-align: middle;
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- MENUS DE VOLTAR DINÂMICOS -->
    <a href="index.html" id="btn-voltar-home" class="btn-voltar">← Voltar para o Portfólio Principal</a>
    <a onclick="voltarParaMenuPrincipal()" id="btn-voltar-temas" class="btn-voltar" style="display: none;">← Voltar para Categorias de Flyers</a>
    <a onclick="abrirSubMenuPapelaria()" id="btn-voltar-papelaria" class="btn-voltar" style="display: none;">← Voltar para Papelaria Mãos Criativas</a>

    <!-- =========================================================
         1. MENU PRINCIPAL DE FLYERS
         ========================================================= -->
    <div class="grid-menu" id="menu-temas">
        <div class="menu-linha">
            
            <!-- Categoria 1: Papelaria Mãos Criativas -->
            <div class="quadrado-tema">
                <img src="imagens/flyers/papelaria_maos_criativas/catalogo_oficial/catologo_oficial (1).JPG" alt="Papelaria Mãos Criativas">
                <h3>PAPELARIA MÃOS CRIATIVAS</h3>
                <button class="btn-abrir" onclick="abrirSubMenuPapelaria()">Ver Catálogo</button>
            </div>

            <!-- Espaços reservados para novos projetos de flyers -->
            <div class="quadrado-tema" style="visibility: hidden; border: none; background: transparent;"></div>
            <div class="quadrado-tema" style="visibility: hidden; border: none; background: transparent;"></div>

        </div>
    </div>

    <!-- =========================================================
         2. SUB-MENU: PAPELARIA MÃOS CRIATIVAS
         ========================================================= -->
    <div class="grid-menu sub-menu" id="menu-papelaria">
        <h2 style="color: var(--accent-blue); text-align: center; margin-bottom: 25px; width: 100%;"></h2>
        
        <div class="menu-linha">
            <div class="quadrado-tema">
                <img src="imagens/flyers/papelaria_maos_criativas/catalogo_oficial/catologo_oficial (1).JPG" alt="Catálogo Oficial">
                <h3>CATÁLOGO</h3>
                <button class="btn-abrir" onclick="abrirGaleria('galeria-catalogo-oficial', 'papelaria')">Ver Fotos</button>
            </div>
            <div class="quadrado-tema" style="visibility: hidden; border: none; background: transparent;"></div>
            <div class="quadrado-tema" style="visibility: hidden; border: none; background: transparent;"></div>
        </div>
    </div>

    <!-- =========================================================
         3. GALERIA DE FOTOS (MURAL)
         ========================================================= -->

    <!-- GALERIA: CATÁLOGO OFICIAL -->
    <!-- GALERIA: CATÁLOGO OFICIAL -->
    <div class="galeria-fotos" id="galeria-catalogo-oficial">
        <h2 style="color: var(--accent-blue); text-align: center; margin-bottom: 20px;"></h2>
        <div class="mural-fotos">
            <div class="mural-linha">
                <div class="mural-coluna"><img src="imagens/flyers/papelaria_maos_criativas/catalogo_oficial/catologo_oficial (2).JPG" alt="Flyer 2" onclick="abrirFotoGrande(this)"></div>
                <div class="mural-coluna"><img src="imagens/flyers/papelaria_maos_criativas/catalogo_oficial/catologo_oficial (3).JPG" alt="Flyer 3" onclick="abrirFotoGrande(this)"></div>
                <div class="mural-coluna"><img src="imagens/flyers/papelaria_maos_criativas/catalogo_oficial/catologo_oficial (4).JPG" alt="Flyer 4" onclick="abrirFotoGrande(this)"></div>
            </div>
            <div class="mural-linha">
                <div class="mural-coluna"><img src="imagens/flyers/papelaria_maos_criativas/catalogo_oficial/catologo_oficial (5).JPG" alt="Flyer 5" onclick="abrirFotoGrande(this)"></div>
                <div class="mural-coluna"><img src="imagens/flyers/papelaria_maos_criativas/catalogo_oficial/catologo_oficial (6).JPG" alt="Flyer 6" onclick="abrirFotoGrande(this)"></div>
                <div class="mural-coluna"><img src="imagens/flyers/papelaria_maos_criativas/catalogo_oficial/catologo_oficial (7).JPG" alt="Flyer 7" onclick="abrirFotoGrande(this)"></div>
            </div>
            <div class="mural-linha">
                <div class="mural-coluna"><img src="imagens/flyers/papelaria_maos_criativas/catalogo_oficial/catologo_oficial (8).JPG" alt="Flyer 8" onclick="abrirFotoGrande(this)"></div>
                <div class="mural-coluna"><img src="imagens/flyers/papelaria_maos_criativas/catalogo_oficial/catologo_oficial (9).JPG" alt="Flyer 9" onclick="abrirFotoGrande(this)"></div>
                <div class="mural-coluna"><img src="imagens/flyers/papelaria_maos_criativas/catalogo_oficial/catologo_oficial (10).JPG" alt="Flyer 10" onclick="abrirFotoGrande(this)"></div>
            </div>
        </div>
    </div>

<!-- =========================================================
         4. JANELA FLUTUANTE (LIGHTBOX)
         ========================================================= -->
    <div id="visualizadorLightbox" class="lightbox-modal" onclick="fecharFotoGrande()">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="fotoExpandida">
    </div>

    <!-- =========================================================
         5. LÓGICA INTERATIVA (JAVASCRIPT)
         ========================================================= -->
    <script>
        var listaFotosAtiva = [];
        var indexFotoAtual = -1;

        function esconderTudo() {
            document.getElementById("menu-temas").style.display = "none";
            document.getElementById("menu-papelaria").style.display = "none";
            
            var galerias = document.getElementsByClassName("galeria-fotos");
            for (var i = 0; i < galerias.length; i++) {
                galerias[i].style.display = "none";
            }

            document.getElementById("btn-voltar-home").style.display = "none";
            document.getElementById("btn-voltar-temas").style.display = "none";
            document.getElementById("btn-voltar-papelaria").style.display = "none";
        }

        function voltarParaMenuPrincipal() {
            esconderTudo();
            document.getElementById("menu-temas").style.display = "table";
            document.getElementById("btn-voltar-home").style.display = "inline-block";
        }

        function abrirSubMenuPapelaria() {
            esconderTudo();
            document.getElementById("menu-papelaria").style.display = "table";
            document.getElementById("btn-voltar-temas").style.display = "inline-block";
        }

        function abrirGaleria(idGaleria, origem) {
            esconderTudo();
            
            var galeriaAlvo = document.getElementById(idGaleria);
            if (!galeriaAlvo) return;
            
            galeriaAlvo.style.display = "block";

            if (origem === 'papelaria') {
                document.getElementById("btn-voltar-papelaria").style.display = "inline-block";
            } else {
                document.getElementById("btn-voltar-temas").style.display = "inline-block";
            }

            var imagensGerais = galeriaAlvo.querySelectorAll(".mural-coluna img");
            listaFotosAtiva = [];
            
            imagensGerais.forEach(function(img) {
                if (img.parentElement.style.visibility !== "hidden") {
                    listaFotosAtiva.push(img);
                }
            });
        }

        function abrirFotoGrande(elementoImg) {
            var lightbox = document.getElementById("visualizadorLightbox");
            var imagemGrande = document.getElementById("fotoExpandida");
            lightbox.style.display = "block";
            imagemGrande.src = elementoImg.src;
            indexFotoAtual = listaFotosAtiva.indexOf(elementoImg);
        }

        function fecharFotoGrande() {
            document.getElementById("visualizadorLightbox").style.display = "none";
        }

        function mudarFoto(direcao) {
            if (listaFotosAtiva.length === 0 || indexFotoAtual === -1) return;
            indexFotoAtual += direcao;
            if (indexFotoAtual >= listaFotosAtiva.length) {
                indexFotoAtual = 0;
            } else if (indexFotoAtual < 0) {
                indexFotoAtual = listaFotosAtiva.length - 1;
            }
            document.getElementById("fotoExpandida").src = listaFotosAtiva[indexFotoAtual].src;
        }

        document.addEventListener('keydown', function(event) {
            var lightbox = document.getElementById("visualizadorLightbox");
            if (lightbox && lightbox.style.display === "block") {
                if (event.key === "ArrowRight") {
                    mudarFoto(1);
                } else if (event.key === "ArrowLeft") {
                    mudarFoto(-1);
                } else if (event.key === "Escape") {
                    fecharFotoGrande();
                }
            }
        });
    </script>
</body>
</html>
