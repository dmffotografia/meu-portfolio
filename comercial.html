<!DOCTYPE html>

<head>

    <title>Davi Melo | Galeria Comercial & Paisagens</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #1a2126;
            --accent-blue: #00e5ff;
            --text-primary: #ffffff;
            --text-secondary: #8b949e;
            --border-color: #2d3842;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-family);
            color: var(--text-primary);
            padding: 30px 4%;
        }

        .btn-voltar {
            display: inline-block;
            color: var(--text-secondary);
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 25px;
            transition: color 0.3s;
            font-size: 11pt;
            cursor: pointer;
        }

        .btn-voltar:hover {
            color: var(--accent-blue);
        }

        /* Estrutura de Tabela para os Quadrados de Temas / Clientes */
        .grid-menu {
            display: table;
            width: 100%;
            border-collapse: separate;
            border-spacing: 20px;
        }

        .menu-linha {
            display: table-row;
        }

        .quadrado-tema {
            display: table-cell;
            width: 33.33%;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            vertical-align: top;
            text-align: center;
            padding-bottom: 25px;
            transition: transform 0.3s, border-color 0.3s;
        }

        .quadrado-tema:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
        }

        .quadrado-tema img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .quadrado-tema h3 {
            font-size: 14pt;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .btn-abrir {
            display: inline-block;
            background-color: var(--accent-blue);
            color: #000;
            padding: 9px 22px;
            font-size: 10pt;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-abrir:hover {
            background-color: #00b8d4;
        }

        /* Estrutura Oculta Inicial para Galerias e Sub-menus */
        .galeria-fotos, .sub-menu {
            display: none;
        }

        /* Mural de Fotos */
        .mural-fotos {
            display: table;
            width: 100%;
            border-collapse: separate;
            border-spacing: 15px;
            margin-top: 20px;
        }

        .mural-linha {
            display: table-row;
        }

        .mural-coluna {
            display: table-cell;
            width: 33.33%;
            vertical-align: top;
        }

        .mural-coluna img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
            transition: transform 0.3s ease, filter 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .mural-coluna img:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
            cursor: pointer;
        }

        /* Lightbox Base */
        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: pan-y;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
            z-index: 3002;
        }

        .lightbox-close:hover {
            color: var(--accent-blue);
        }

        /* Setas Ocultas no Computador */
        .lightbox-btn {
            display: none;
        }

        /* =========================================================
           REGRAS EXCLUSIVAS PARA O MOBILE (ATÉ 768px)
           ========================================================= */
        @media (max-width: 768px) {
            body {
                padding: 15px 3%;
            }

            /* Adapta o layout das tabelas nos menus para não ficarem espremidos */
            .grid-menu {
                display: block;
            }

            .menu-linha {
                display: block;
            }

            .quadrado-tema {
                display: block !important;
                width: 100% !important;
                margin-bottom: 20px;
            }

            .quadrado-tema img {
                height: 200px;
            }

            .quadrado-tema[style*="visibility: hidden"] {
                display: none !important;
            }

            /* Setas de navegação visíveis apenas no Celular */
            .lightbox-btn {
                display: flex !important;
                align-items: center;
                justify-content: center;
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                background: rgba(0, 0, 0, 0.6);
                color: #ffffff;
                border: 1px solid var(--accent-blue);
                font-size: 18px;
                padding: 8px 12px;
                cursor: pointer;
                border-radius: 50%;
                user-select: none;
                z-index: 3001;
            }

            .lightbox-prev { left: 10px; }
            .lightbox-next { right: 10px; }
        }
    </style>
</head>

                <div class="mural-coluna"><img src="imagens/comercial/moda_e_comercial/rubra_fashion/ensaio_outubro/moda1 (45).jpg" alt="Moda 45" onclick="abrirFotoGrande(this)"></div>
                <div class="mural-coluna"><img src="imagens/comercial/moda_e_comercial/rubra_fashion/ensaio_outubro/moda1 (46).jpg" alt="Moda 46" onclick="abrirFotoGrande(this)"></div>
                <div class="mural-coluna"><img src="imagens/comercial/moda_e_comercial/rubra_fashion/ensaio_outubro/moda1 (47).jpg" alt="Moda 47" onclick="abrirFotoGrande(this)"></div>
            </div>
            <div class="mural-linha">
                <div class="mural-coluna"><img src="imagens/comercial/moda_e_comercial/rubra_fashion/ensaio_outubro/moda1 (48).jpg" alt="Moda 48" onclick="abrirFotoGrande(this)"></div>
                <div class="mural-coluna" style="visibility: hidden; border: none; background: transparent;"></div>
                <div class="mural-coluna" style="visibility: hidden; border: none; background: transparent;"></div>
            </div>
        </div>
    </div>

    <!-- =========================================================
         5. JANELA FLUTUANTE (LIGHTBOX)
         ========================================================= -->
    <div id="visualizadorLightbox" class="lightbox-modal">
        <span class="lightbox-close" onclick="fecharFotoGrande()">&times;</span>
        <button class="lightbox-btn lightbox-prev" onclick="mudarFoto(-1); event.stopPropagation();">&#10094;</button>
        <img class="lightbox-content" id="fotoExpandida">
        <button class="lightbox-btn lightbox-next" onclick="mudarFoto(1); event.stopPropagation();">&#10095;</button>
    </div>

    <!-- =========================================================
         6. LÓGICA INTERATIVA (JAVASCRIPT CORRIGIDO)
         ========================================================= -->
    <script>
        var listaFotosAtiva = [];
        var indexFotoAtual = -1;
        var touchStartX = 0;
        var touchEndX = 0;

        function esconderTudo() {
            document.getElementById("menu-temas").style.display = "none";
            if (document.getElementById("menu-moda")) {
                document.getElementById("menu-moda").style.display = "none";
            }
            if (document.getElementById("menu-rubra")) {
                document.getElementById("menu-rubra").style.display = "none";
            }
            
            var galerias = document.getElementsByClassName("galeria-fotos");
            for (var i = 0; i < galerias.length; i++) {
                galerias[i].style.display = "none";
            }

            document.getElementById("btn-voltar-home").style.display = "none";
            document.getElementById("btn-voltar-temas").style.display = "none";
            if (document.getElementById("btn-voltar-moda")) {
                document.getElementById("btn-voltar-moda").style.display = "none";
            }
            if (document.getElementById("btn-voltar-rubra")) {
                document.getElementById("btn-voltar-rubra").style.display = "none";
            }
        }

        function voltarParaMenuPrincipal() {
            esconderTudo();
            document.getElementById("menu-temas").style.display = (window.innerWidth <= 768) ? "block" : "table";
            document.getElementById("btn-voltar-home").style.display = "inline-block";
        }

        function abrirSubMenuModa() {
            esconderTudo();
            document.getElementById("menu-moda").style.display = (window.innerWidth <= 768) ? "block" : "table";
            document.getElementById("btn-voltar-temas").style.display = "inline-block";
        }

        function abrirSubMenuRubra() {
            esconderTudo();
            document.getElementById("menu-rubra").style.display = (window.innerWidth <= 768) ? "block" : "table";
            document.getElementById("btn-voltar-moda").style.display = "inline-block";
        }

        function abrirGaleria(idGaleria, origem) {
            esconderTudo();
            
            var galeriaAlvo = document.getElementById(idGaleria);
            if (!galeriaAlvo) return;
            
            galeriaAlvo.style.display = "block";

            if (origem === 'rubra') {
                document.getElementById("btn-voltar-rubra").style.display = "inline-block";
            } else if (origem === 'moda') {
                document.getElementById("btn-voltar-moda").style.display = "inline-block";
            } else {
                document.getElementById("btn-voltar-temas").style.display = "inline-block";
            }

            var imagensGerais = galeriaAlvo.querySelectorAll(".mural-coluna img");
            listaFotosAtiva = [];
            
            imagensGerais.forEach(function(img) {
                if (img.parentElement.style.visibility !== "hidden") {
                    listaFotosAtiva.push(img);
                }
            });
        }

        function abrirFotoGrande(elementoImg) {
            var lightbox = document.getElementById("visualizadorLightbox");
            var imagemGrande = document.getElementById("fotoExpandida");
            lightbox.style.display = "flex";
            imagemGrande.src = elementoImg.src;
            indexFotoAtual = listaFotosAtiva.indexOf(elementoImg);
        }

        function fecharFotoGrande() {
            document.getElementById("visualizadorLightbox").style.display = "none";
        }

        function mudarFoto(direcao) {
            if (listaFotosAtiva.length === 0 || indexFotoAtual === -1) return;
            indexFotoAtual += direcao;
            if (indexFotoAtual >= listaFotosAtiva.length) {
                indexFotoAtual = 0;
            } else if (indexFotoAtual < 0) {
                indexFotoAtual = listaFotosAtiva.length - 1;
            }
            document.getElementById("fotoExpandida").src = listaFotosAtiva[indexFotoAtual].src;
        }

        /* Fechar clicando no fundo escuro */
        document.getElementById("visualizadorLightbox").addEventListener('click', function(e) {
            if (e.target === this) {
                fecharFotoGrande();
            }
        });

        /* Navegação via Teclado */
        document.addEventListener('keydown', function(event) {
            var lightbox = document.getElementById("visualizadorLightbox");
            if (lightbox && lightbox.style.display === "flex") {
                if (event.key === "ArrowRight") {
                    mudarFoto(1);
                } else if (event.key === "ArrowLeft") {
                    mudarFoto(-1);
                } else if (event.key === "Escape") {
                    fecharFotoGrande();
                }
            }
        });

        /* Navegação por Gesto no Celular (Swipe) */
        var lightboxElement = document.getElementById("visualizadorLightbox");
        
        lightboxElement.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        lightboxElement.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            tratarDeslize();
        }, false);

        function tratarDeslize() {
            var limiteDistancia = 50;
            if (touchEndX < touchStartX - limiteDistancia) {
                mudarFoto(1);
            }
            if (touchEndX > touchStartX + limiteDistancia) {
                mudarFoto(-1);
            }
        }
    </script>
</body>
</html>
